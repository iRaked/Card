<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="icon" type="image/x-icon" href="https://santi-graphics.vercel.app/assets/img/Cake.ico" />
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Rick">
  <title>Feliz Cumpleaños Eluney</title>
  <link rel="author" href="https://santi-graphics.vercel.app/copyright.txt">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Raleway&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- BLOCK -->
  <script type="text/javascript">
  document.onkeydown = function(){return false};
  document.oncontextmenu = function(){return false}
  </script>
  
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      font-family: 'Raleway', sans-serif;
      background: #000;
      height: 100vh;
      display: flex;
      align-items: center; justify-content: center;
      overflow: hidden;
    }
    #confettiCanvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    .card {
      background: #111;
      border: 2px solid #d4af37;
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(212,175,55,0.4);
      max-width: 500px;
      width: 90%;
      position: relative;
      z-index: 2;
      min-height: 520px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .card video {
      width: 180px; height: 180px;
      object-fit: cover;
      border-radius: 50%;
      margin: 0 auto 20px;
      border: 3px solid #d4af37;
      box-shadow: 0 6px 15px rgba(212,175,55,0.6);
    }
    #content-wrapper { transition: opacity 0.8s ease; opacity: 1; }
    .fade-out { opacity: 0 !important; }
    h1 { font-family: 'Playfair Display', serif; color: #d4af37; font-size: 2.2em; margin: 10px 0; }
    p { color: #eee; font-size: 1.1em; line-height: 1.6; margin-bottom: 30px; min-height: 80px; }
    .icons { display: flex; justify-content: center; gap: 25px; }
    .icons i { font-size: 2em; color: #d4af37; transition: all 0.3s ease; cursor: pointer; }
    .icons i:hover { color: #ff4081; transform: scale(1.2); }
    
    .music-control {
      position: fixed;
      top: 20px; right: 20px;
      z-index: 100;
      background: rgba(212, 175, 55, 0.2);
      border: 1px solid #d4af37;
      border-radius: 50%;
      width: 50px; height: 50px;
      display: flex;
      align-items: center; justify-content: center;
      cursor: pointer;
      color: #d4af37;
      font-size: 1.5em;
    }
    .rotating { animation: spin 3s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .emoji-pop {
      position: fixed; z-index: 9999; font-size: 2.5em;
      pointer-events: none;
      animation: floatAndFade 1.5s forwards;
    }
    @keyframes floatAndFade {
      0% { transform: translate(-50%, 0) scale(0.5); opacity: 0; }
      20% { opacity: 1; transform: translate(-50%, -30px) scale(1.2); }
      100% { transform: translate(-50%, -150px) scale(1); opacity: 0; }
    }
  </style>
</head>
<body>

  <canvas id="confettiCanvas"></canvas>

  <div class="music-control" id="musicBtn" onclick="toggleMusic()">
    <i class="fas fa-compact-disc" id="musicIcon"></i>
  </div>

  <audio id="birthdaySong" loop>
    <source src="https://iraked.github.io/ExtasisRadio/assets/Panda-Feliz-cumpleanos.mp3" type="audio/mpeg">
  </audio>

  <div class="card animate__animated animate__fadeInUp">
    <video autoplay loop muted playsinline>
      <source src="https://santi-graphics.vercel.app/assets/video/Argentos.mp4" type="video/mp4">
    </video>
    
    <div id="content-wrapper">
      <h1 id="slide-title">✨ Feliz Cumpleaños, Eluney ✨</h1>
      <p id="slide-text">
        Celebrar tu vida es mi mayor alegría. Gracias por compartir este segundo año a mi lado, llenándolo de luz y de nosotros. ¡Que este día sea solo el inicio de lo mejor!<br><br>
        <strong>Te quiero mucho, mi conejita.</strong>
      </p>
      <div class="icons" id="slide-icons">
        <i class="fas fa-gift" onclick="spawnEmoji(event)"></i>
        <i class="fas fa-champagne-glasses" onclick="spawnEmoji(event)"></i>
        <i class="fas fa-birthday-cake" onclick="spawnEmoji(event)"></i>
        <i class="fas fa-heart" onclick="spawnEmoji(event)"></i>
      </div>
    </div>
  </div>

  <script>
    const song = document.getElementById('birthdaySong');
    const musicIcon = document.getElementById('musicIcon');
    let isPlaying = false;

    function toggleMusic() {
      if (!isPlaying) {
        song.play();
        musicIcon.classList.add('rotating');
      } else {
        song.pause();
        musicIcon.classList.remove('rotating');
      }
      isPlaying = !isPlaying;
    }

    document.body.addEventListener('click', () => {
        if(!isPlaying) toggleMusic();
    }, { once: true });

    const slides = [
      {
        title: "✨ Feliz Cumpleaños, Eluney ✨",
        text: "Celebrar tu vida es mi mayor alegría. Gracias por compartir este segundo año a mi lado, llenándolo de luz y de nosotros. ¡Que este día sea solo el inicio de lo mejor!<br><br><strong>Te quiero mucho, mi conejita.</strong>",
        icons: ['fa-gift', 'fa-champagne-glasses', 'fa-birthday-cake', 'fa-heart']
      },
      {
        title: "❤️ Un Sueño que Crece ❤️",
        text: "Amor, cada día a tu lado es un regalo. Estoy muy feliz de celebrar un año más contigo y me ilusiona mucho todo lo que vivimos, guardando siempre en mi corazón el deseo de que, cuando la vida nos lo permita, sigamos acumulando momentos especiales uno al lado del otro.",
        icons: ['fa-star', 'fa-gem', 'fa-wand-magic-sparkles', 'fa-crown']
      },
      {
        title: "🥂 Por Todo lo que Viene 🥂",
        text: "La vida nos ha unido y mi mayor deseo es seguir construyendo recuerdos inolvidables a tu lado. ¡Feliz día, baby! Te mereces todo el amor del mundo hoy y siempre.",
        icons: ['fa-glass-cheers', 'fa-music', 'fa-republican', 'fa-fire']
      }
    ];

    let currentSlide = 0;
    const wrapper = document.getElementById('content-wrapper');
    const titleEl = document.getElementById('slide-title');
    const textEl = document.getElementById('slide-text');
    const iconsEl = document.getElementById('slide-icons');

    function nextSlide() {
      wrapper.classList.add('fade-out');
      setTimeout(() => {
        currentSlide = (currentSlide + 1) % slides.length;
        const data = slides[currentSlide];
        titleEl.innerText = data.title;
        textEl.innerHTML = data.text;
        iconsEl.innerHTML = '';
        data.icons.forEach(iconClass => {
          const icon = document.createElement('i');
          icon.className = `fas ${iconClass}`;
          icon.onclick = (e) => spawnEmoji(e);
          iconsEl.appendChild(icon);
        });
        wrapper.classList.remove('fade-out');
      }, 800);
    }

    setInterval(nextSlide, 8000);

    window.onload = () => {
      const end = Date.now() + 4000;
      (function frame() {
        confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#d4af37', '#ffffff'] });
        confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#d4af37', '#ffffff'] });
        if (Date.now() < end) requestAnimationFrame(frame);
      }());
    };

    function spawnEmoji(e) {
      const emojiList = ["🎉","🥳","🎂","🎁","🍾","💖","✨","💎"];
      const emoji = document.createElement('div');
      emoji.className = 'emoji-pop';
      emoji.innerText = emojiList[Math.floor(Math.random() * emojiList.length)];
      const rect = e.target.getBoundingClientRect();
      emoji.style.left = (rect.left + rect.width / 2) + "px";
      emoji.style.top = rect.top + "px";
      document.body.appendChild(emoji);
      setTimeout(() => emoji.remove(), 1500);
    }
  </script>
</body>
</html>
